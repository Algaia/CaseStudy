services:
  app:
    build: .
    container_name: laravel-app
    ports:
      - "8000:80"
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db

  db:
    image: mysql:8.0
    container_name: laravel-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: casestudy
      MYSQL_USER: casestudy
      MYSQL_PASSWORD: casestudy
    ports:
      - "3308:3306"
    volumes:
      - laravel_db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: laravel-pma
    restart: always
    ports:
      - "8083:80"
    environment:
      PMA_HOST: db

volumes:
  laravel_db_data: